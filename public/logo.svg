<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <!-- Background rounded squircle gradient for icon -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Leaf Loop Gradient -->
    <linearGradient id="logoLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Flow Ribbon Gradient -->
    <linearGradient id="logoFlowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- AI Gradient for text badge -->
    <linearGradient id="aiBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#047857" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left) -->
  <g transform="translate(15, 15)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="150" height="150" rx="38" fill="url(#logoBgGrad)" filter="url(#logoGlow)" />
    <rect x="1" y="1" width="148" height="148" rx="37" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.3" />

    <!-- Infinity / Sprout AI Symbol -->
    <g transform="scale(0.29) translate(5, 5)">
      <!-- Leaf Loop -->
      <path
        d="M 256,256 C 210,180 150,150 95,195 C 40,240 50,330 115,365 C 180,400 230,340 256,256 Z"
        fill="url(#logoLeafGrad)"
      />
      <!-- Restock Loop -->
      <path
        d="M 256,256 C 302,332 362,362 417,317 C 472,272 462,182 397,147 C 332,112 282,172 256,256 Z"
        fill="url(#logoFlowGrad)"
        opacity="0.95"
      />
      <!-- Synergy Fold -->
      <path
        d="M 215,220 C 235,190 277,190 297,220 C 277,250 235,250 215,220 Z"
        fill="#ffffff"
        opacity="0.35"
      />
      <!-- Spark -->
      <g transform="translate(390, 150)">
        <circle cx="0" cy="0" r="14" fill="#fbbf24" />
        <path d="M 0,-24 L 4,-6 L 22,0 L 4,6 L 0,24 L -4,6 L -22,0 L -4,-6 Z" fill="#ffffff" />
      </g>
      <!-- Center dot -->
      <circle cx="256" cy="256" r="12" fill="#ffffff" />
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY (Right) -->
  <g transform="translate(195, 0)">
    <!-- "RepeatLess" Text -->
    <text
      x="0"
      y="102"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="62"
      font-weight="900"
      letter-spacing="-1.5"
      fill="#1c1917"
    >
      Repeat<tspan fill="#047857">Less</tspan>
    </text>

    <!-- ".AI" Capsule Badge -->
    <g transform="translate(370, 52)">
      <rect x="0" y="0" width="84" height="46" rx="14" fill="url(#aiBadgeGrad)" />
      <text
        x="42"
        y="32"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24"
        font-weight="900"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="1"
      >
        AI
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text
      x="2"
      y="136"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="16"
      font-weight="700"
      letter-spacing="2.5"
      text-transform="uppercase"
      fill="#78716c"
    >
      Autonomous Household Restocking
    </text>
  </g>
</svg>
